# YCollector — settings.ini
# 모든 항목은 선택입니다. 빠진 키는 코드 기본값을 사용합니다.
# 우선순위:  CLI 인자  >  --config PATH  >  사용자 config dir  >  이 파일
#
# 사용자별 개인 설정을 원하면 (이 파일을 수정하지 않고):
#   Windows:  %APPDATA%\YCollector\settings.ini
#   macOS:    ~/Library/Application Support/YCollector/settings.ini
#   Linux:    ~/.config/ycollector/settings.ini
# 를 만드시면 우선 적용됩니다.

[defaults]
# 화질: 144p | 240p | 360p | 480p | 720p | 1080p | 1440p | 2160p | best | audio
quality = 1080p

# 비디오 코덱: auto | h264 | vp9 | av1
codec = auto

# 오디오: best | m4a | opus
audio = best

# 컨테이너: mp4 | mkv | webm
container = mp4

[output]
# 출력 폴더 (상대 또는 절대 경로)
output_dir = downloads

# 자막 임베드 + 언어 (쉼표 구분, embed_subs=false면 자막 자체를 안 받음)
embed_subs = true
sub_langs = ko,en

# 쿠키 임포트 브라우저 (chrome|firefox|edge|brave, 빈 값 = 사용 안 함)
# 비공개/멤버십/연령제한 영상에 필요. 사용 시 브라우저는 완전히 종료해 두세요.
cookies_from_browser =

[playlist]
# 재생목록 처리 모드.
#   auto    — youtu.be/<id>?list=...  같은 "단일 영상 + 재생목록 컨텍스트"는
#             단일 영상으로 처리. youtube.com/playlist?list=... 같은 순수
#             재생목록 URL은 펼침. (기본 권장)
#   expand  — 항상 재생목록 펼침 (yt-dlp 기본).
#   single  — 항상 단일 영상만 (모든 list= 무시).
mode = auto

# 펼침 시 최대 N개까지만 받기 (빈 값 = 제한 없음)
max_downloads =

# 펼침 시 특정 항목만 (빈 값 = 전부). 예: 1-10, 5,7,12-, 1,3,5
items =

[network]
# Phase 0 Day 3 — 멈춤 대응 기본값.

# socket_timeout: N초 동안 데이터가 오지 않으면 socket abort + retry.
# yt-dlp 자체 기본은 매우 큼 → 멈춤 감지가 늦음. 30이 권장.
# 빠른 회복을 원하면 15, 느린 네트워크면 60.
socket_timeout = 30

# retries: 연결 실패 재시도 횟수.
retries = 10

# fragment_retries: DASH / HLS 프래그먼트 실패 재시도.
fragment_retries = 10

# throttled_rate: 다운로드 속도가 이 미만으로 떨어지면 connection 재시작.
# YouTube의 의도적 단일-연결 throttling 대응에 효과적.
# 빈 값 = 비활성. 예: 100K (= 100 KB/s), 1M (= 1 MB/s).
throttled_rate = 100K
