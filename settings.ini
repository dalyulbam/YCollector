# YCollector — settings.ini
# 모든 항목은 선택입니다. 빠진 키는 코드 기본값을 사용합니다.
# 우선순위:  CLI 인자  >  --config PATH  >  사용자 config dir  >  이 파일
#
# 사용자별 개인 설정을 원하면 (이 파일을 수정하지 않고):
#   Windows:  %APPDATA%\YCollector\settings.ini
#   macOS:    ~/Library/Application Support/YCollector/settings.ini
#   Linux:    ~/.config/ycollector/settings.ini
# 를 만드시면 우선 적용됩니다.

[defaults]
# 화질: 144p | 240p | 360p | 480p | 720p | 1080p | 1440p | 2160p | best | audio
quality = 1080p

# 비디오 코덱: auto | h264 | vp9 | av1
codec = auto

# 오디오: best | m4a | opus
audio = best

# 컨테이너: mp4 | mkv | webm
container = mp4

[output]
# 출력 폴더 (상대 또는 절대 경로)
output_dir = downloads

# 자막 임베드 + 언어 (쉼표 구분, embed_subs=false면 자막 자체를 안 받음)
embed_subs = true
sub_langs = ko,en

# 쿠키 임포트 브라우저 (chrome|firefox|edge|brave, 빈 값 = 사용 안 함)
# 비공개/멤버십/연령제한 영상에 필요. 사용 시 브라우저는 완전히 종료해 두세요.
# 메인 Chrome 을 켜둔 채로 쓰고 싶다면 아래 cookies_file 을 권장.
cookies_from_browser =

# Netscape HTTP Cookie File 경로. 빈 값이면 자동 탐지
# (%APPDATA%\YCollector\cookies.txt 또는 ~/.config/ycollector/cookies.txt).
# cookies_from_browser 보다 우선합니다.
# 생성:  uv run ycollector-login   (별 Chromium 으로 로그인 → 자동 저장)
cookies_file =

[playlist]
# 재생목록 처리 모드.
#   auto    — youtu.be/<id>?list=...  같은 "단일 영상 + 재생목록 컨텍스트"는
#             단일 영상으로 처리. youtube.com/playlist?list=... 같은 순수
#             재생목록 URL은 펼침. (기본 권장)
#   expand  — 항상 재생목록 펼침 (yt-dlp 기본).
#   single  — 항상 단일 영상만 (모든 list= 무시).
mode = auto

# 펼침 시 최대 N개까지만 받기 (빈 값 = 제한 없음)
max_downloads =

# 펼침 시 특정 항목만 (빈 값 = 전부). 예: 1-10, 5,7,12-, 1,3,5
items =

[network]
# Phase 0 Day 3 — 멈춤 대응 기본값.

# socket_timeout: N초 동안 데이터가 오지 않으면 socket abort + retry.
# yt-dlp 자체 기본은 매우 큼 → 멈춤 감지가 늦음. 30이 권장.
# 빠른 회복을 원하면 15, 느린 네트워크면 60.
socket_timeout = 30

# retries: 연결 실패 재시도 횟수.
retries = 10

# fragment_retries: DASH / HLS 프래그먼트 실패 재시도.
fragment_retries = 10

# throttled_rate: 다운로드 속도가 이 미만으로 떨어지면 connection 재시작.
# YouTube의 의도적 단일-연결 throttling 대응에 효과적.
# 빈 값 = 비활성. 예: 100K (= 100 KB/s), 1M (= 1 MB/s).
throttled_rate = 100K

# no_check_certificate: yt-dlp 인증서 검증 끄기 — 백신/프록시 TLS 가로채기 최후 수단.
# 평소엔 pip_system_certs 의존성이 OS 신뢰 저장소로 검증을 통과시키므로 false 권장.
# OS 신뢰 저장소로도 'CERTIFICATE_VERIFY_FAILED' 가 날 때만 true 로.
no_check_certificate = false
# YouTube 추출 클라이언트 강제(yt-dlp --extractor-args youtube:player_client).
# 빈 값 = yt-dlp 기본 선택. 기본 체인이 YouTube 의 SABR/PO-token 실험에 걸리면
# 메타데이터/포맷 목록은 정상인데 실제 미디어 fetch 만 'HTTP Error 403' 으로
# 죽는다(yt-dlp #12482). 그럴 때 web_embedded 로 우회한다.
# 값 예: web_embedded | android | ios | tv  (쉼표로 여러 개 = 순서대로 시도)
player_client = web_embedded,default
# 요청 사이 간격(초). 0 = 간격 없음.
# 수백 개짜리 채널/해시태그를 쉬지 않고 긁으면 YouTube 가
# 'Sign in to confirm you are not a bot' 으로 세션을 막는다(실측: 쇼츠 37개째부터
# 나머지 313개 전부 차단). sleep_requests 는 메타데이터 요청 사이,
# sleep_interval~max_sleep_interval 은 영상 사이의 랜덤 대기.
# 영상 몇 개만 받을 땐 0 이어도 되고, 대량 작업엔 1 / 2~5 정도를 권장.
sleep_requests = 0
sleep_interval = 0
max_sleep_interval = 0
