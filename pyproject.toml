[project]
name = "ycollector"
version = "0.1.0"
description = "YouTube video collector — yt-dlp 기반 데스크톱 다운로더"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "dalyulbam" }]
keywords = ["youtube", "download", "yt-dlp", "video"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2026.2.0",
    "PySide6>=6.8.0",
]

[project.optional-dependencies]
transcribe = [
    "faster-whisper>=1.0.0",
]
build = [
    "nuitka>=2.5",
    "pyinstaller>=6.10",
    # Nuitka build orchestration extras (Windows)
    "ordered-set>=4.1; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ycollector = "ycollector.cli:main"

[project.gui-scripts]
ycollector-gui = "ycollector.gui:main"

[project.urls]
Homepage = "https://github.com/dalyulbam/YCollector"
Documentation = "https://github.com/dalyulbam/YCollector/tree/main/docs"
Issues = "https://github.com/dalyulbam/YCollector/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ycollector"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
