[project]
name = "ycollector"
version = "0.1.0"
description = "YouTube video collector — yt-dlp 기반 데스크톱 다운로더"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "dalyulbam" }]
keywords = ["youtube", "download", "yt-dlp", "video"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2026.2.0",
    # 백신/프록시 TLS 가로채기 환경 대응. 인터프리터 시작 시 .pth 로 SSL 을
    # OS 신뢰 저장소(Windows 인증서 저장소 등)에 연결해, 서브프로세스로 도는
    # yt-dlp 도 가로채는 루트 CA 를 신뢰하게 한다(certifi 번들엔 그 CA 가 없어
    # 'CERTIFICATE_VERIFY_FAILED → Unable to handle request' 로 실패하던 문제).
    # in-process API 클라이언트(anthropic/openai/whisper)는 각 extra 의 truststore
    # 가 담당하고, 이 패키지는 subprocess yt-dlp 경로를 담당한다.
    "pip-system-certs>=4.0",
]

[project.optional-dependencies]
# 레거시 PySide6 GUI(`ycollector-gui`). 신규 Tauri UI 사용자는 설치 불필요.
# 새 UI가 기능 패리티에 도달하면 본 extras도 제거 예정.
gui-legacy = [
    "PySide6>=6.8.0",
]
# 가상 Chromium(Playwright)으로 YouTube 로그인 → cookies.txt export.
# 메인 Chrome 종료 없이 비공개/멤버십/연령제한 영상 다운로드 가능.
# 사용:  uv sync --extra cookies-headed && uv run playwright install chromium
#       uv run ycollector-login
cookies-headed = [
    "playwright>=1.50.0",
]
# Sora 2 Pro (OpenAI Videos API) 등 비디오 생성 어댑터.
# .env 자동 로드용 python-dotenv 포함. httpx 는 SSE / multipart 처리에 사용.
# 주의: OpenAI Videos API 는 2026-09-24 sunset 공지. 본 어댑터는 provider 추상화로
# 후속 모델(Veo/Runway/Pika 등)로 교체 용이.
video-gen = [
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    # 백신/프록시 TLS 가로채기 환경에서 OS 인증서 저장소 사용(certifi UnknownIssuer 회피).
    "truststore>=0.9.0",
]
# 브라우저 UI 로컬 서버. FastAPI + Uvicorn + SSE.
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
]
transcribe = [
    "faster-whisper>=1.1.0",
    # TLS 가로채기 환경에서 HuggingFace 모델 다운로드 시 OS 신뢰 저장소 사용
    # (certifi UnknownIssuer 회피). video-gen extra 와 동일 전략.
    "truststore>=0.9.0",
]
# GPU(CUDA 12) 추론용 런타임 라이브러리. CTranslate2 가 cublas64_12.dll /
# cudnn_*64_9.dll 을 요구. 미설치 시 엔진은 자동으로 CPU(int8) 폴백.
# 사용:  uv sync --extra transcribe --extra transcribe-cuda --native-tls
transcribe-cuda = [
    "nvidia-cublas-cu12>=12.3; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9.0; sys_platform != 'darwin'",
]
# 전사록 → 구조화 요약(전체 요약 + 핵심 파트 + 시간대). Anthropic Claude API.
# .env 의 ANTHROPIC_API_KEY 사용. truststore 로 TLS 가로채기 환경 대응.
summarize = [
    "anthropic>=0.50.0",
    "python-dotenv>=1.0.0",
    "truststore>=0.9.0",
]
# 화자 분리(diarization) — 토큰 불필요. pyannote(게이트 모델) 대신 공개 speechbrain
# ECAPA 임베딩 + 응집형 클러스터링으로 '이름 없이 화자만 구분'. torch 필요(대용량).
# 사용:  uv sync --extra diarize --native-tls
#        ycollector-diarize --analysis-dir <_analysis 폴더>
diarize = [
    "speechbrain>=1.0.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "scikit-learn>=1.3.0",
    "soundfile>=0.12.0",
]
build = [
    # legacy GUI 빌드에 PySide6 필요. CLI(sidecar)만 빌드할 때도
    # build_exe.py 의 --enable-plugin=pyside6 가 자동으로 skip.
    "PySide6>=6.8.0",
    "nuitka>=2.5",
    "pyinstaller>=6.10",
    # Nuitka build orchestration extras (Windows)
    "ordered-set>=4.1; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ycollector = "ycollector.cli:main"
ycollector-login = "ycollector.cookies:main"
ycollector-generate = "ycollector.generator.cli:main"
ycollector-transcribe = "ycollector.transcribe.cli:main"
ycollector-analyze = "ycollector.transcribe.analyze:main"
ycollector-diarize = "ycollector.transcribe.diarize:main"
ycollector-album = "ycollector.transcribe.album:main"
ycollector-server = "ycollector.server:main"

[project.gui-scripts]
ycollector-gui = "ycollector.gui:main"

[project.urls]
Homepage = "https://github.com/dalyulbam/YCollector"
Documentation = "https://github.com/dalyulbam/YCollector/tree/main/docs"
Issues = "https://github.com/dalyulbam/YCollector/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ycollector"]

[tool.hatch.build.targets.wheel.shared-data]
# webui/ 정적 파일은 패키지에 동봉.

[tool.hatch.build.targets.wheel.force-include]
"src/ycollector/webui" = "ycollector/webui"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
